name: Daily Stock & Crypto Scanner

on:
  schedule:
    # รอบเช้า: 08:30 น. เวลาไทย (01:30 UTC) - หลังตลาด US ปิด & ก่อนตลาด SET เปิด
    - cron: '30 1 * * *'
    # รอบเย็น: 18:00 น. เวลาไทย (11:00 UTC) - หลังตลาด SET ปิดทำการ & อัปเดตคริปโต
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    env:
      WATCHLIST_JSON: ${{ secrets.WATCHLIST_JSON }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi
          if [ -f "stock-crypto-scanner/requirements.txt" ]; then pip install -r stock-crypto-scanner/requirements.txt; fi

      - name: Run Market Scanner & Send LINE
        if: env.WATCHLIST_JSON == ''
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          if [ -f "main.py" ]; then python main.py; else cd stock-crypto-scanner && python main.py; fi
