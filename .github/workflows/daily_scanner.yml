name: Daily Stock & Crypto Scanner

on:
  schedule:
    # รันอัตโนมัติทุกวันเวลา 08:30 น. (เวลาไทย)
    - cron: '30 1 * * *'
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi
          if [ -f "stock-crypto-scanner/requirements.txt" ]; then pip install -r stock-crypto-scanner/requirements.txt; fi

      - name: Run Market Scanner & Send LINE
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          if [ -f "main.py" ]; then python main.py; else cd stock-crypto-scanner && python main.py; fi
