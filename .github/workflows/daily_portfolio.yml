name: Daily portfolio LINE Flex report at 08 Bangkok

on:
  schedule:
    - cron: '53 0 * * *'
    - cron: '8 1 * * *'
    - cron: '23 1 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only (no LINE broadcast)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: daily-portfolio-line
  cancel-in-progress: false

jobs:
  portfolio-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: stock-crypto-scanner/requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: .daily-portfolio-state
          key: daily-portfolio-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: daily-portfolio-state-v1-
      - name: Install dependencies
        run: |
          mkdir -p .daily-portfolio-state
          python -m pip install requests
      - name: Verify portfolio report tests
        run: python -m unittest discover -s stock-crypto-scanner -p 'test_portfolio_report.py'
      - name: Send daily portfolio Flex report or preview
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: python stock-crypto-scanner/portfolio_report.py
      - uses: actions/cache/save@v4
        if: always() && (github.event_name != 'workflow_dispatch' || !inputs.dry_run)
        with:
          path: .daily-portfolio-state
          key: daily-portfolio-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
