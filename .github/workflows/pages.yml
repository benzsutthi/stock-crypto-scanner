name: Deploy MarketScope to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'stock-crypto-scanner/**'
      - '.github/workflows/pages.yml'
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: stock-crypto-scanner/requirements.txt
      - name: Restore market history cache
        uses: actions/cache/restore@v4
        with:
          path: .market-cache
          key: market-history-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: market-history-v1-
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare static site
        run: |
          mkdir -p _site
          python -m pip install --disable-pip-version-check -r stock-crypto-scanner/requirements.txt
          python -m unittest discover -s stock-crypto-scanner -p 'test_*.py'
          (cd stock-crypto-scanner && node test_filters.cjs && node test_crypto_loader.cjs && node test_average_cost.cjs && node test_early_cycle.cjs && node test_updates.cjs && node test_index_overview.cjs)
          python stock-crypto-scanner/build_market_data.py --output _site/data/stocks.json --previous .market-cache/stocks.json
          python stock-crypto-scanner/build_crypto_data.py --output _site/data/crypto.json --previous .market-cache/crypto.json
          python stock-crypto-scanner/build_indices.py --output _site/data/indices.json --previous .market-cache/indices.json --crypto _site/data/crypto.json
          cp stock-crypto-scanner/index.html stock-crypto-scanner/style.css stock-crypto-scanner/screener.css stock-crypto-scanner/app.js _site/
          cp stock-crypto-scanner/updates.js _site/
          cp stock-crypto-scanner/average-cost.html stock-crypto-scanner/average-cost.css stock-crypto-scanner/average-cost.js _site/
          cp stock-crypto-scanner/brand.css stock-crypto-scanner/index-overview.css stock-crypto-scanner/index-overview.js stock-crypto-scanner/marketscope-logo.png stock-crypto-scanner/marketscope-icon.png stock-crypto-scanner/favicon.png _site/
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Save successful market snapshots
        run: |
          mkdir -p .market-cache
          cp _site/data/stocks.json _site/data/crypto.json _site/data/indices.json .market-cache/
      - uses: actions/cache/save@v4
        with:
          path: .market-cache
          key: market-history-v1-${{ github.run_id }}-${{ github.run_attempt }}
